

<div>
<h2>Create Car</h2>
<input [(ngModel)]="brand" placeholder="Brand">
<input [(ngModel)]="model" placeholder="Model">
<input [(ngModel)]="year" placeholder="Year" type="number">
<input [(ngModel)]="licensePlate" placeholder="License Plate">
<input [(ngModel)]="owner" placeholder="Owner">
<input [(ngModel)]="ownerPhone" placeholder="Owner Phone">

<button (click)="saveCar()">Save</button>
</div>
